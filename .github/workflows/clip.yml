name: Clip new GTA 6 streams
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Stream link to clip (leave empty to look for new streams)"
        required: false

concurrency:
  group: shorts-state
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CLOUD_STATE: "1"
      SHORTS_DATA: ${{ github.workspace }}/data
      TZ: Asia/Karachi
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      HF_HOME: ${{ github.workspace }}/.cache/hf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: .cache/hf
          key: whisper-medium-v1
      - name: Install
        run: |
          sudo apt-get install -y -q ffmpeg >/dev/null
          pip install -q "yt-dlp[default]==2026.10.26" yt-dlp-ejs==0.8.0 bgutil-ytdlp-pot-provider==2.0.2 faster-whisper==1.2.1 ctranslate2==4.9.0 \
            opencv-python-headless==5.1.0.95 numpy==2.5.5 \
            google-api-python-client==2.202.0 google-auth==2.61.0 google-auth-oauthlib==1.5.0
          npm install --no-save --silent @vercel/blob@2.8.2
          npm install -g --silent @anthropic-ai/claude-code@2.1.319
      - name: Restore state
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: |
          python cloudstate.py pull
          mkdir -p "$SHORTS_DATA/youtube"
          printf '%s' "$YT_CLIENT_SECRET_JSON" > "$SHORTS_DATA/youtube/client_secret.json"
          [ -s "$SHORTS_DATA/youtube/token_agent.json" ] || printf '%s' "$YT_TOKEN_JSON" > "$SHORTS_DATA/youtube/token_agent.json"
          echo "$YT_COOKIES_B64" | base64 -d > "$SHORTS_DATA/youtube/cookies.txt"
      - name: Clip
        env:
          URL: ${{ inputs.url }}
        run: |
          if [ -n "$URL" ]; then python auto_clip.py --url "$URL" --trigger dashboard; else python auto_clip.py --trigger schedule; fi
      - name: Upload + sync
        if: always()
        run: python agent.py
      - name: Save state
        if: always()
        run: |
          rm -f "$SHORTS_DATA/youtube/cookies.txt"
          python cloudstate.py push
