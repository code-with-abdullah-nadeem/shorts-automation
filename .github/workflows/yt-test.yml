name: YouTube download test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q "yt-dlp[default]==2026.10.26" yt-dlp-ejs==0.8.0 && sudo apt-get install -y -q ffmpeg >/dev/null
      - name: Cookies
        env: { YT_COOKIES_B64: "${{ secrets.YT_COOKIES_B64 }}" }
        run: echo "$YT_COOKIES_B64" | base64 -d > cookies.txt && wc -l cookies.txt
      - name: Without cookies
        continue-on-error: true
        run: python -m yt_dlp --js-runtimes node --skip-download --print title "https://www.youtube.com/watch?v=l-oEKLu4Y3w"
      - name: With cookies (1 minute at <=1440p)
        run: |
          python -m yt_dlp --js-runtimes node --cookies cookies.txt -f "bv*[height<=1440]+ba[ext=m4a]/b" \
            --download-sections "*600-660" --merge-output-format mp4 -o test.mp4 "https://www.youtube.com/watch?v=l-oEKLu4Y3w"
          ls -la test.mp4
      - name: Remove cookies
        if: always()
        run: rm -f cookies.txt
